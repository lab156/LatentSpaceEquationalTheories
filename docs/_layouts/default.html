<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #24292e;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 40px;
            background-color: #fff;
        }
        header {
            border-bottom: 1px solid #eaecef;
            margin-bottom: 40px;
            padding-bottom: 20px;
            text-align: center;
        }
        h1 { font-size: 2.5em; font-weight: 600; margin-bottom: 10px; }
        .authors { color: #586069; font-size: 1.2em; margin-bottom: 5px; }
        .metadata { color: #0366d6; font-family: monospace; }
        
        .abstract {
            background: #f6f8fa;
            border: 1px solid #d1d5da;
            padding: 25px;
            border-radius: 6px;
            margin-bottom: 40px;
        }
        .abstract h2 { margin-top: 0; font-size: 1.2em; color: #24292e; border: none; }
        
        h2 { 
            font-size: 1.75em; 
            border-bottom: 1px solid #eaecef; 
            padding-bottom: 0.3em; 
            margin-top: 1.5em; 
        }
        .highlight-box {
            border-left: 4px solid #28a745;
            padding-left: 15px;
            margin: 20px 0;
            background-color: #f0fff4;
            padding: 10px 15px;
        }
        code {
            background-color: rgba(27,31,35,0.05);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #eaecef;
            font-size: 0.9em;
            color: #6a737d;
            text-align: center;
        }

.table-container {
    display: flex;
    justify-content: center;
    margin-top: 50px;
  }

  table {
    border-collapse: collapse;
    width: 50%;
    font-family: Arial, sans-serif;
  }

  th, td {
    border: 1px solid #dddddd;
    text-align: center;
    padding: 12px;
  }

  th {
    background-color: #f2f2f2;
  }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ]
            });
        });
    </script>
</head>
<body>

{{ content }}

</body>
</html>
